name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Swift 6 · tests · iOS Release
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify committed project is up to date
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- SprintTimer.xcodeproj
      - name: Test timing and image engines
        run: swift test --package-path Packages/SprintTimerCore
      - name: Test iOS and archive without signing
        run: bash scripts/ci-ios.sh
      - name: Upload test evidence and unsigned archive
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: SprintTimer-iOS-${{ github.sha }}
          path: |
            .build-ci/TestResults.xcresult
            .build-ci/*.log
            .build-ci/SprintTimer-unsigned.xcarchive.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
